[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imagetxt"
version = "0.1.0"
description = "이미지 속 영어 텍스트를 로컬 OCR로 그대로 옮겨 적는 웹앱"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
imagetxt = "imagetxt.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
imagetxt = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
